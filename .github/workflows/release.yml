name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag precisa bater com VERSION
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME diferente de VERSION ($VERSION)" >&2
            exit 1
          fi
      - name: Gate
        run: scripts/verify.sh
      - name: Empacotar
        run: scripts/package.sh
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/WinTools-$VERSION.zip" \
            "dist/WinTools-$VERSION.dmg" \
            "dist/WinTools-$VERSION.sha256" \
            --title "WinTools $VERSION" \
            --generate-notes
